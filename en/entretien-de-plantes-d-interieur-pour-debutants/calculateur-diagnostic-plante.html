<h1>Calculator: Why Is My Plant Yellowing and Watering Frequency</h1>

      qSoil: "Quand vous arrosez habituellement, l'état du terreau est :", soilAlwaysMoist: "Toujours humide, je n'attends pas qu'il sèche", soilTopDry: "Le dessus est sec mais humide en profondeur", soilFullyDry: "Complètement sec, parfois depuis longtemps",

      disclaimer: "Diagnostic basé sur des repères horticoles courants — ne remplace pas l'observation directe de la plante ni l'avis d'un(e) spécialiste en cas de doute persistant."
    },
    en: {

      qLight: "Where is it placed?", lightDirect: "Direct sun several hours/day", lightIndirect: "Bright but indirect light", lightLow: "Darker corner of the room",
      qSoil: "When you usually water, the soil is:", soilAlwaysMoist: "Always moist, I don't wait for it to dry", soilTopDry: "Top is dry but moist underneath", soilFullyDry: "Completely dry, sometimes for a while",

  function diagnose(plant, lightAnswer, soilAnswer, yellowAnswer) {
    const needsRegularMoisture = plant.categorieLumiere === "indirecte" || plant.categorieLumiere === "faible_ok";
    const sunSensitive = plant.categorieLumiere === "indirecte" || plant.categorieLumiere === "faible_ok";

    if (yellowAnswer === "oldest") return { key: "aging", ok: true };
    if (soilAnswer === "alwaysMoist") return { key: "overwater", ok: false };
    if (lightAnswer === "direct" && sunSensitive) return { key: "sun", ok: false };
    if (soilAnswer === "fullyDry" && needsRegularMoisture) return { key: "underwater", ok: false };
    if (yellowAnswer === "tips") return { key: "environ", ok: false };
    return { key: "unknown", ok: false };
  }

  function render() {
    const t = L[LANG] || L.fr;
    const root = document.getElementById("plante-calc");
    root.innerHTML = `
      <label>${t.qPlant}</label>
      <select id="p-plant">${PLANTS.map(p => `<option value="${p.id}">${p.nom[LANG] || p.nom.fr}</option>`).join("")}</select>

      <label>${t.qLight}</label>
      <select id="p-light">
        <option value="direct">${t.lightDirect}</option>
        <option value="indirect">${t.lightIndirect}</option>
        <option value="low">${t.lightLow}</option>
      </select>

      <label>${t.qSoil}</label>
      <select id="p-soil">
        <option value="alwaysMoist">${t.soilAlwaysMoist}</option>
        <option value="topDry">${t.soilTopDry}</option>
        <option value="fullyDry">${t.soilFullyDry}</option>
      </select>

      <label>${t.qYellow}</label>
      <select id="p-yellow">
        <option value="oldest">${t.yellowOldest}</option>
        <option value="mixed">${t.yellowMixed}</option>
        <option value="tips">${t.yellowTips}</option>
      </select>

      <div id="p-result" class="result"></div>
      <div class="disclaimer">${t.disclaimer}</div>
    `;

    const plantSel = document.getElementById("p-plant");
    const lightSel = document.getElementById("p-light");
    const soilSel = document.getElementById("p-soil");
    const yellowSel = document.getElementById("p-yellow");
    const resultDiv = document.getElementById("p-result");

    const diagLabels = {
      aging: [t.diagAging, t.diagAgingDetail], overwater: [t.diagOverwater, t.diagOverwaterDetail],
      sun: [t.diagSun, t.diagSunDetail], underwater: [t.diagUnderwater, t.diagUnderwaterDetail],
      environ: [t.diagEnviron, t.diagEnvironDetail], unknown: [t.diagUnknown, t.diagUnknownDetail]
    };

    function update() {
      const plant = PLANTS.find(p => p.id === plantSel.value);
      const diag = diagnose(plant, lightSel.value, soilSel.value, yellowSel.value);
      const [label, detail] = diagLabels[diag.key];
      resultDiv.innerHTML = `
        <div class="diagnostic ${diag.ok ? "ok" : ""}">
          <div class="label">${label}</div>
          <div>${detail}</div>
        </div>
        <dl class="reco">
          <div style="font-weight:700;margin-bottom:6px">${t.recoTitle} (${plant.nom[LANG] || plant.nom.fr})</div>
          <dt>${t.recoLight}</dt><dd>${plant.lumiere[LANG] || plant.lumiere.fr}</dd>
          <dt>${t.recoWater}</dt><dd>${plant.arrosage[LANG] || plant.arrosage.fr}</dd>
        </dl>
      `;
    }

    plantSel.addEventListener("change", update);
    lightSel.addEventListener("change", update);
    soilSel.addEventListener("change", update);
    yellowSel.addEventListener("change", update);
    update();
  }

  render();
})();
</script>
