<main>
<article>
<h1>Calculator: Real Monthly Cost by Pet Type</h1>
<p>Choose a type of pet to estimate its real monthly cost (food, hygiene, basic vet care) and the startup costs to plan for.</p>

<div id="animal-calc"></div>
<style>
  #animal-calc { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 24px 0; }
  #animal-calc select { width: 100%; padding: 8px; font-size: 1em; margin-bottom: 16px; }
  #animal-calc table { width: 100%; border-collapse: collapse; font-size: 0.9em; margin-bottom: 12px; }
  #animal-calc td, #animal-calc th { padding: 6px 4px; border-bottom: 1px solid #eee; text-align: left; }
  #animal-calc td:last-child, #animal-calc th:last-child { text-align: right; }
  #animal-calc .stats { display: flex; gap: 16px; flex-wrap: wrap; margin: 16px 0; }
  #animal-calc .stat { background: #f4f4f4; border-radius: 6px; padding: 10px 14px; flex: 1; min-width: 140px; }
  #animal-calc .stat .value { font-size: 1.3em; font-weight: bold; color: #0a5; }
  #animal-calc .stat .caption { font-size: 0.8em; color: #666; }
  #animal-calc .disclaimer { font-size: 0.8em; color: #999; margin-top: 16px; padding-top: 12px; border-top: 1px solid #eee; }
</style>
<script>
(function() {
  const LANG = "en";

  const PETS = [
    { id: "dog",     label: { fr: "Chien", en: "Dog", es: "Perro" },
      monthly: { food: 60, hygiene: 15, vet: 40 }, startup: 300 },
    { id: "cat",     label: { fr: "Chat", en: "Cat", es: "Gato" },
      monthly: { food: 40, hygiene: 20, vet: 30 }, startup: 200 },
    { id: "rabbit",  label: { fr: "Lapin", en: "Rabbit", es: "Conejo" },
      monthly: { food: 35, hygiene: 15, vet: 20 }, startup: 250 },
    { id: "hamster", label: { fr: "Hamster / petit rongeur", en: "Hamster / small rodent", es: "Hámster / pequeño roedor" },
      monthly: { food: 10, hygiene: 10, vet: 5 }, startup: 100 },
    { id: "bird",    label: { fr: "Oiseau (ex. perruche)", en: "Bird (e.g. parakeet)", es: "Ave (ej. periquito)" },
      monthly: { food: 15, hygiene: 8, vet: 10 }, startup: 150 }
  ];

  const L = {
    fr: { choose: "Choisis un type d'animal :", food: "Nourriture", hygiene: "Hygiène / litière", vet: "Vétérinaire de base (étalé sur l'année)",
          monthlyTotal: "Total mensuel estimé", startupTotal: "Frais de départ estimés (une fois)",
          disclaimer: "Estimations génériques (moyennes approximatives au Canada) — varient selon la race, la taille, la région et les choix de produits. Ne remplace pas un devis vétérinaire réel." },
    en: { choose: "Choose a type of animal:", food: "Food", hygiene: "Hygiene / litter", vet: "Basic vet care (spread over the year)",
          monthlyTotal: "Estimated monthly total", startupTotal: "Estimated startup costs (one-time)",
          disclaimer: "Generic estimates (rough Canadian averages) — vary by breed, size, region, and product choices. Does not replace a real veterinary quote." },
    es: { choose: "Elige un tipo de animal:", food: "Alimento", hygiene: "Higiene / arena", vet: "Veterinario básico (repartido en el año)",
          monthlyTotal: "Total mensual estimado", startupTotal: "Costos iniciales estimados (una vez)",
          disclaimer: "Estimaciones genéricas (promedios aproximados en Canadá) — varían según la raza, el tamaño, la región y las elecciones de productos. No reemplaza una cotización veterinaria real." }
  };

  function render() {
    const t = L[LANG] || L.fr;
    const root = document.getElementById("animal-calc");
    const select = document.createElement("select");
    select.innerHTML = PETS.map(p => `<option value="${p.id}">${p.label[LANG] || p.label.fr}</option>`).join("");
    const resultDiv = document.createElement("div");

    function update() {
      const pet = PETS.find(p => p.id === select.value);
      const monthlyTotal = pet.monthly.food + pet.monthly.hygiene + pet.monthly.vet;
      resultDiv.innerHTML = `
        <table>
          <tr><td>${t.food}</td><td>${pet.monthly.food.toFixed(2)} $</td></tr>
          <tr><td>${t.hygiene}</td><td>${pet.monthly.hygiene.toFixed(2)} $</td></tr>
          <tr><td>${t.vet}</td><td>${pet.monthly.vet.toFixed(2)} $</td></tr>
        </table>
        <div class="stats">
          <div class="stat"><div class="value">${monthlyTotal.toFixed(2)} $</div><div class="caption">${t.monthlyTotal}</div></div>
          <div class="stat"><div class="value">${pet.startup.toFixed(2)} $</div><div class="caption">${t.startupTotal}</div></div>
        </div>
        <div class="disclaimer">${t.disclaimer}</div>
      `;
    }

    select.addEventListener("change", update);
    root.innerHTML = `<div style="margin-bottom:8px;font-weight:600">${t.choose}</div>`;
    root.appendChild(select);
    root.appendChild(resultDiv);
    update();
  }

  render();
})();
</script>
